<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에너지 흐름 추적소: 버려지는 에너지를 잡아라!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--f:'a시네마L','a시네마','aCinemaL','Gaegu',sans-serif;}
*{box-sizing:border-box;font-weight:400 !important;}
html,body{margin:0;}
body{font-family:var(--f);background:linear-gradient(180deg,#e7f3ff 0%,#fff8ea 100%);color:#2b2b2b;font-size:18px;line-height:1.55;min-height:100vh;-webkit-text-size-adjust:100%;}
svg text{font-family:var(--f);}
button,input,textarea,select{font-family:var(--f);font-size:17px;}
h1,h2,h3,h4{margin:4px 0 8px;}
h1{font-size:27px;color:#1d3557;}
h2{font-size:24px;color:#1d3557;}
h3{font-size:21px;color:#2b5d9c;}
h4{font-size:19px;color:#6a3fa0;}
.c-b{color:#1e6fd9}.c-r{color:#e2463b}.c-g{color:#1f9d55}.c-o{color:#e67e22}.c-p{color:#8e44ad}.c-t{color:#0e8f8f}.c-y{color:#c48a00}
.small{font-size:15px;color:#555}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);}
.title-sub{font-size:16px;color:#e67e22}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand img{height:62px;width:auto}
.brand .mail{font-size:14px;color:#1e6fd9;text-align:right;line-height:1.3}
#gaugeWrap{position:sticky;top:0;z-index:30;background:#fffdf3;padding:6px 18px 8px;border-bottom:2px dashed #ffcf70;}
#gaugeTop{display:flex;justify-content:space-between;flex-wrap:wrap;font-size:15px;gap:6px}
.gbar{display:flex;height:26px;border-radius:13px;overflow:hidden;background:#cfd8dc;border:2px solid #37474f;margin-top:3px}
.gseg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;transition:width .6s}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px;max-width:1140px;margin:0 auto}
.tab{border:none;border-radius:14px;padding:8px 14px;background:#fff;box-shadow:0 4px 0 #b9cbe0;cursor:pointer;color:#1d3557}
.tab.on{background:#4f9cf9;color:#fff;box-shadow:0 4px 0 #2b6cc4}
.tab.locked{background:#e3e3e3;color:#8a8a8a;box-shadow:0 4px 0 #bdbdbd}
main{max-width:1140px;margin:0 auto;padding:0 14px 70px}
.card{background:#fff;border-radius:20px;padding:16px 20px;margin:12px 0;box-shadow:0 5px 0 #d6e2f0,0 8px 16px rgba(0,0,0,.05)}
.card.intro{background:linear-gradient(120deg,#fff 60%,#eef7ff)}
.btn{border:none;border-radius:14px;padding:9px 16px;background:#fff1cf;box-shadow:0 4px 0 #e0b45a;cursor:pointer;color:#333;margin:4px 3px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e0b45a}
.btn.primary{background:#4f9cf9;color:#fff;box-shadow:0 4px 0 #2b6cc4}
.btn.green{background:#2ecc71;color:#fff;box-shadow:0 4px 0 #1e9a52}
.btn.red{background:#ff7a6b;color:#fff;box-shadow:0 4px 0 #c94a3c}
.btn.sel{background:#2ecc71;color:#fff;box-shadow:0 4px 0 #1e9a52}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.grid2,.grid4{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start}.brand{align-self:flex-end}}
.mlist{margin:6px 0;padding-left:22px}
.mlist li{margin:3px 0;color:#555}
.mlist li.done{color:#1f9d55}
.mlist li.done::after{content:'  ✔ 완료'}
.stagebox{background:#f4f9ff;border-radius:16px;padding:8px;text-align:center}
.inlabel{font-size:19px;margin:4px 0}
.chip{display:inline-block;padding:8px 14px;border-radius:22px;background:var(--c);color:#fff;margin:5px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.chip.picked{outline:4px solid #222;outline-offset:2px}
.chip.used{opacity:.22;pointer-events:none}
.ghost{position:fixed;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);z-index:999;margin:0}
.bank{background:#fafafa;border-radius:14px;padding:6px;text-align:center}
.arrowd{text-align:center;color:#e67e22;margin:4px}
.slot{border:3px dashed #aab4c0;border-radius:14px;padding:10px;margin:6px 0;text-align:center;color:#8a96a3;min-height:48px;cursor:pointer;transition:.2s}
.slot.over{background:#eaf3ff;border-color:#1e6fd9}
.slot.filled{border-style:solid;color:#fff}
.blkbtns .btn{padding:7px 12px}
.sumline{font-size:18px;margin:8px 0}
.blank{display:inline-block;min-width:86px;border-bottom:3px solid #8e44ad;text-align:center;color:#8e44ad;cursor:pointer;padding:0 6px}
.wordbank .btn{background:#f3e9ff;box-shadow:0 4px 0 #b08be0}
.hidden{display:none!important}
.fb{margin-top:6px;font-size:16px;min-height:1px}
.fb.ok{color:#1f9d55}.fb.no{color:#e2463b}
.sankey{width:100%;height:auto;display:block;background:#fbfdff;border-radius:14px;border:1px solid #e1ebf5}
.devsvg{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.fx{opacity:0;transition:opacity .5s}
svg.on-light .fx-light,svg.on-sound .fx-sound,svg.on-motion .fx-motion,svg.on-heat .fx-heat{opacity:1}
svg.on-light .scr{fill:#fff7c9}
.spin{animation:spin .4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.rise{animation:rise 1.6s linear infinite}
@keyframes rise{0%{transform:translateY(6px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.flow{stroke-dasharray:8 6;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.thwrap{position:relative;border-radius:16px;overflow:hidden}
.legend{height:14px;border-radius:7px;background:linear-gradient(90deg,#283593,#1e88e5,#26c6da,#66bb6a,#ffee58,#ffa726,#ef5350,#ffffff);border:1px solid #999}
.legendlab{display:flex;justify-content:space-between;font-size:13px;color:#555}
.reading{background:#1b1b33;color:#ffe082;border-radius:12px;padding:8px 12px;margin-top:8px;font-size:17px;min-height:42px}
.part{cursor:pointer}
.formula{background:#f6f0ff;border-radius:14px;padding:10px;text-align:center;font-size:19px;margin:8px 0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 6px}
.frac span:first-child{border-bottom:2px solid #6a3fa0;padding:0 6px}
.case{border:2px solid #e6eef7;border-radius:16px;padding:10px 14px;margin:10px 0}
.case.done{border-color:#2ecc71;background:#f3fff7}
.vals span{display:inline-block;margin:2px 10px 2px 0}
input.num{width:90px;padding:6px 8px;border-radius:10px;border:2px solid #9fb6d1;text-align:center}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.hbar{position:relative;display:flex;height:30px;border-radius:10px;overflow:visible;background:#eee;margin:8px 0 22px}
.hbar .u{background:#f2b705;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:10px 0 0 10px;transition:width .5s;white-space:nowrap;overflow:hidden}
.hbar .h{background:#e2463b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:0 10px 10px 0;transition:width .5s;white-space:nowrap;overflow:hidden}
.hbar .tline{position:absolute;top:-6px;bottom:-6px;width:0;border-left:3px dashed #1d3557}
.hbar .tlab{position:absolute;top:33px;font-size:13px;color:#1d3557;transform:translateX(-50%);white-space:nowrap}
.sector{border:3px solid transparent;border-radius:22px}
.sector.fail{border-color:#ff7a6b;animation:shake .4s}
.sector.pass{border-color:#2ecc71}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.scene{width:100%;height:auto;display:block;background:#f4f9ff;border-radius:14px}
.cmpbar{display:flex;align-items:center;gap:6px;font-size:14px;margin:3px 0}
.cmpbar .nm{width:72px}
.cmpbar .bar{flex:1;display:flex;height:16px;border-radius:8px;overflow:hidden}
.meter{height:26px;background:#eceff1;border-radius:13px;position:relative;overflow:visible;margin:6px 0 24px}
.meter .fill{height:100%;border-radius:13px;transition:width .5s}
.meter .mk{position:absolute;top:-5px;bottom:-5px;border-left:3px dashed #1d3557}
.meter .mkl{position:absolute;top:30px;font-size:13px;transform:translateX(-50%);white-space:nowrap;color:#1d3557}
.q{border-bottom:1px dashed #ccd;padding:10px 0}
textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid #b8c7da;padding:8px;line-height:1.5}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:10px}
.modal{background:#fff;border-radius:22px;padding:20px;max-width:600px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal img.prev{max-width:100%;border:1px solid #ccc;border-radius:8px;-webkit-touch-callout:default}
.clear-title{font-size:38px;color:#ff8a00;letter-spacing:2px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(30,30,40,.92);color:#fff;padding:10px 18px;border-radius:14px;z-index:1100;max-width:90%;text-align:center}
.hintpop{position:fixed;right:18px;bottom:22px;max-width:360px;background:#fff8e1;border:3px solid #ffb300;border-radius:18px;padding:12px 16px;z-index:1050;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .4s}
.hintpop .hx{float:right;cursor:pointer;color:#999;margin-left:8px}
#resultCard{background:#fff;border-radius:20px;padding:22px;max-width:900px;margin:0 auto;border:3px solid #ffd27f}
.rc-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #ffd27f;padding-bottom:8px;gap:8px}
.rc-head img{height:64px}
.grade{font-size:72px;line-height:1;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.srow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:16px}
.srow .nm{width:190px}
.srow .bar{flex:1;height:16px;background:#eceff1;border-radius:8px;overflow:hidden}
.srow .bar div{height:100%;border-radius:8px}
.box{background:#f8fbff;border-radius:14px;padding:10px 14px;margin:8px 0;border:1px solid #e1ebf5}
.upg{border:2px solid #ffb300;background:#fffaf0;border-radius:16px;padding:10px 14px;margin:8px 0}
.house{width:100%;height:auto;display:block;border-radius:14px}
@media print{
 body{background:#fff}
 header,nav,#gaugeWrap,.noprint,.hintpop,.toast{display:none!important}
 main>section:not(#p6){display:none!important}
 #resultCard{border:none;max-width:100%}
}
</style>
</head>

<script>
/* ================= 공통 ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=v=>Math.abs(v-Math.round(v))<0.05?String(Math.round(v)):v.toFixed(1);
const E_COLOR={'전기':'#2f80ed','화학':'#8e5cd9','빛':'#e0a800','소리':'#27ae60','운동':'#0e9f9f','열':'#e2463b','핵':'#7f8c8d'};
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const S={name:'',id:'',unlocked:new Set([0]),cur:0};

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=.15,type='sine',v=.14,delay=0){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);}catch(e){}}
const sfx={
 click:()=>tone(560,.05,'square',.04),
 ok:()=>{tone(660,.12,'triangle');tone(880,.16,'triangle',.14,.1);},
 bad:()=>{tone(220,.22,'sawtooth',.07);tone(170,.25,'sawtooth',.06,.12);},
 win:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.14,i*.11));},
 whoosh:()=>{tone(300,.3,'sine',.06);tone(600,.25,'sine',.05,.1);}
};

function toast(msg,ms=2200){const t=document.createElement('div');t.className='toast';t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
let hintEl=null;
function hint(msg){if(hintEl)hintEl.remove();hintEl=document.createElement('div');hintEl.className='hintpop';hintEl.innerHTML=`<span class="hx">✕</span>💡 <span class="c-o">힌트</span><br>${msg}`;hintEl.querySelector('.hx').onclick=()=>{if(hintEl){hintEl.remove();hintEl=null;}};document.body.appendChild(hintEl);const me=hintEl;setTimeout(()=>{if(me.parentNode)me.remove();},7000);}
function modal(html,buttons){
 const bg=document.createElement('div');bg.className='modal-bg';
 bg.innerHTML=`<div class="modal">${html}<div class="mbtns" style="margin-top:12px"></div></div>`;
 const box=bg.querySelector('.mbtns');
 (buttons||[{t:'닫기'}]).forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls===undefined?'primary':b.cls);el.innerHTML=b.t;el.onclick=()=>{if(!b.keep)bg.remove();b.f&&b.f(bg);};box.appendChild(el);});
 document.body.appendChild(bg);return bg;
}

/* 총 에너지 보존 게이지 */
function setGauge(segs,note){
 const g=$('#gbar');
 if(!segs||!segs.length){g.innerHTML=`<div class="gseg" style="width:100%;background:#90a4ae">공급된 에너지 100 % (아직 전환 전)</div>`;$('#gaugeNote').textContent=note||'';return;}
 const tot=segs.reduce((a,s)=>a+s.v,0);
 g.innerHTML=segs.map(s=>`<div class="gseg" style="width:${s.v/tot*100}%;background:${s.c}">${s.v/tot*100>=9?s.n+' '+fmt(s.v/tot*100)+'%':''}</div>`).join('');
 $('#gaugeNote').innerHTML=(note||'')+' · 합계 = <span class="c-r">100 %</span>';
}

/* 에너지 흐름도(Sankey) */
function drawSankey(svg,src,outs,note){
 outs=outs.filter(o=>o.value>0);
 const n=outs.length,top=34,avail=186,gap=10,x0=24,x1=360,nw=22;
 const tot=outs.reduce((a,o)=>a+o.value,0);
 const sc=(avail-gap*Math.max(0,n-1))/Math.max(src.value,tot,1);
 const sh=src.value*sc,sy=top+(avail-sh)/2;
 let s=`<rect x="${x0}" y="${sy}" width="${nw}" height="${sh}" rx="4" fill="${src.color}"/>`;
 s+=`<text x="${x0}" y="${sy-10}" fill="${src.color}" font-size="16">${src.name} ${fmt(src.value)} J</text>`;
 let cy=sy;const oh=tot*sc+gap*Math.max(0,n-1);let oy=top+(avail-oh)/2;
 outs.forEach(o=>{const h=o.value*sc,xa=x0+nw,xb=x1,xm=(xa+xb)/2;
  s+=`<path d="M${xa},${cy} C${xm},${cy} ${xm},${oy} ${xb},${oy} L${xb},${oy+h} C${xm},${oy+h} ${xm},${cy+h} ${xa},${cy+h} Z" fill="${o.color}" opacity=".42"/>`;
  s+=`<rect x="${x1}" y="${oy}" width="${nw}" height="${Math.max(h,1.5)}" rx="3" fill="${o.color}"/>`;
  s+=`<text x="${x1+nw+8}" y="${oy+h/2+6}" fill="${o.color}" font-size="16">${o.name} ${fmt(o.value)} J</text>`;
  cy+=h;oy+=h+gap;});
 s+=`<text x="300" y="252" text-anchor="middle" font-size="15" fill="#444">${note||''}</text>`;
 svg.innerHTML=s;
}

/* 탭 */
const TABS=[{id:0,n:'🚀 시작'},{id:1,n:'① 에너지 전환과 보존'},{id:2,n:'② 열화상과 에너지 효율'},{id:3,n:'③ 효율 높이는 기술'},{id:4,n:'④ 에코 하우스'},{id:5,n:'⑤ 학습 점검'},{id:6,n:'🏆 미션 성공'}];
function renderTabs(){
 $('#nav').innerHTML=TABS.map(t=>`<button class="tab ${S.cur===t.id?'on':''} ${S.unlocked.has(t.id)?'':'locked'}" data-t="${t.id}">${S.unlocked.has(t.id)?'':'🔒 '}${t.n}</button>`).join('');
 $('#nav').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;if(!S.unlocked.has(t)){sfx.bad();hint('이전 단계의 미션을 클리어해야 자물쇠가 풀려요! 🔒');return;}sfx.click();go(t);});
}
const onEnter={};
function go(t){S.cur=t;document.querySelectorAll('.pane').forEach((p,i)=>p.classList.toggle('hidden',i!==t));renderTabs();onEnter[t]&&onEnter[t]();window.scrollTo({top:0,behavior:'smooth'});}
function unlock(t){S.unlocked.add(t);renderTabs();}
function markDone(id){const el=document.getElementById(id);if(el)el.classList.add('done');}
function stageClear(n,msg){
 sfx.win();const first=!S.unlocked.has(n+1);unlock(n+1);
 const btns=[];
 if(S.unlocked.has(6)&&n<5)btns.push({t:REDO?'🏆 올라간 점수 확인하기':'🏆 미션 성공 탭으로',cls:'green',f:()=>go(6)});
 if(!(REDO&&S.unlocked.has(6)))btns.push({t:n<4?'다음 단계로 ▶':'학습 점검으로 ▶',f:()=>go(n+1)});
 btns.push({t:'이 단계 더 둘러보기',cls:''});
 modal(`<div class="clear-title">MISSION CLEAR!</div><div style="font-size:50px">🎉</div><p>${msg}</p><p class="c-b">${first?`Tab ${n+1} 잠금이 해제되었어요! 🔓`:'다시 수행한 점수가 기록되었어요! 미션 성공 탭에서 점수 변화를 확인해 보세요.'}</p>`,btns);
}

function build0(){
 $('#p0').innerHTML=`
 <div class="card intro">
  <h2>🕵️ 에너지 흐름 추적 요원 모집!</h2>
  <p>스마트폰, 선풍기, 자동차… 우리 주변의 기기들은 공급받은 에너지를 <span class="c-b">다른 형태의 에너지</span>로 바꾸어 일을 해요.
  그런데 에너지가 전환될 때마다 일부는 <span class="c-r">열에너지</span>가 되어 몰래 빠져나가지요.</p>
  <p>여러분은 오늘 <span class="c-p">에너지 흐름 추적소</span>의 요원이 되어 다음 임무를 수행합니다.</p>
  <ol>

   window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);

 });

 const s3=st3.cleared?clamp(20-3*st3.fails,8,20):0;
 let s4=0;if(st4.cleared&&st4.result){const e=st4.result.eff;s4=clamp((e>=70?20:e>=60?18:16)-2*st4.fails,8,20);}
 const mc=st5.mcFirst.filter(Boolean).length*2,es=st5.essay.reduce((a,e)=>a+essayPts(e),0);
 return {s1,s2,s3,s4,mc,es};
}

  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const w=el.offsetWidth,h=el.offsetHeight;let scale=2;
  if(IS_IOS)scale=Math.min(2,Math.sqrt(15000000/(w*h)));
  scale=Math.max(.6,scale);
  const canvas=await html2canvas(el,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false});
  if(!canvas||!canvas.width||!canvas.height)throw new Error('empty');
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
  if(!blob||blob.size<2000)throw new Error('empty');
  wait.remove();openPreview(blob);
 }catch(e){wait.remove();modal('<p>이미지를 만들지 못했어요. 잠시 후 다시 시도해 주세요.</p>');}
}
function openPreview(blob){
 const url=URL.createObjectURL(blob);const fname=`에너지흐름추적소_${S.id}_${S.name}.png`;
 modal(`<h3>🖼️ 결과 이미지 미리보기</h3><img class="prev" src="${url}" alt="결과 이미지"><p class="small">${IS_IOS?'"이미지 저장하기"를 누르면 공유 시트가 열려요. <span class="c-o">이미지 저장</span> 또는 <span class="c-o">파일에 저장</span>을 고르세요.<br>버튼이 작동하지 않으면 위 이미지를 <span class="c-o">길게 눌러 \'사진 앱에 저장\'</span>하세요.':'"이미지 저장하기"를 누르면 PNG 파일로 내려받아요.'}</p>`,
 [{t:'💾 이미지 저장하기',cls:'green',keep:true,f:async()=>{
   const file=new File([blob],fname,{type:'image/png'});
   if(IS_IOS){
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'에너지 흐름 추적소 결과'});}catch(e){if(e&&e.name!=='AbortError')toast('공유 시트를 열 수 없어요. 이미지를 길게 눌러 저장하세요.',3500);}}
    else toast('이 환경에서는 버튼 저장이 어려워요. 미리보기 이미지를 길게 눌러 \'사진 앱에 저장\'하세요.',4000);
   }else{const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();toast('PNG 파일로 내려받았어요.');}
  }},{t:'닫기',cls:''}]);
}
